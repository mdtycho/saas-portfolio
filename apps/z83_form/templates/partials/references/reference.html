<div class="grid grid-cols-1 md:grid-cols-3 gap-6 reference-row">
    <div>
        <label for="ReferenceName_{{reference_number}}" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input type="text" name="ReferenceName_{{reference_number}}"
            class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
    </div>
    <div>
        <label for="Relationship_{{reference_number}}" class="block text-sm font-medium text-gray-700 mb-1">Relationship to
            you</label>
        <input type="text" name="Relationship_{{reference_number}}"
            class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
    </div>
    <div>
        <label for="ReferenceTelephone_{{reference_number}}" class="block text-sm font-medium text-gray-700 mb-1">Telephone
            Number</label>
        <input type="tel" name="ReferenceTelephone_{{reference_number}}"
            class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
    </div>
    <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Office hours</label>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="officeOpen_{{reference_number}}" class="block text-sm font-medium text-gray-700 mb-1">Office
                    open</label>
                <input type="time" id="officeOpen_{{reference_number}}" name="officeOpen_{{reference_number}}"
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>
            <div>
                <label for="officeClose_{{reference_number}}" class="block text-sm font-medium text-gray-700 mb-1">Office
                    close</label>
                <input type="time" id="officeClose_{{reference_number}}" name="officeClose_{{reference_number}}"
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>
        </div>
    </div>
</div>
