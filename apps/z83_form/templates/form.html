<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z83 Smart Editor</title>
    <link rel="stylesheet" href="{{ url_for('z83.static', filename='css/src/output.css') }}">
    <script src="{{ url_for('z83.static', filename='js/script.js') }}"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen py-10">

    <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-lg p-8">
        
        <div class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-900">Z83 Application Form</h1>
            <p id="saveStatus" class="text-sm text-gray-500 mt-2 h-4">Draft empty</p>
        </div>

        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
            <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 33%"></div>
        </div>

        <form action="{{ url_for('z83.save_form') }}" method="POST" id="z83Form">
            
            <div class="form-step" data-step="1">
                <h2 class="text-xl font-semibold mb-4 text-blue-700">1. Personal Details</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Surname</label>
                        <input type="text" name="Surname" required 
                               class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">First Names</label>
                        <input type="text" name="FirstNames" required 
                               class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Initials</label>
                        <input type="text" name="Initials" required 
                               class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                    </div>
                </div>

                <div class="mt-8 flex justify-end">
                    <button type="button" onclick="nextStep(2)" 
                            class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
                        Next Step &rarr;
                    </button>
                </div>
            </div>

            <div class="form-step hidden" data-step="2">
                <h2 class="text-xl font-semibold mb-4 text-blue-700">2. Contact Info</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" name="Phone" 
                           class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Identity Number</label>
                    <input type="text" name="IdentityNumber" 
                           class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>

                <div class="mt-8 flex justify-between">
                    <button type="button" onclick="prevStep(1)" 
                            class="bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600 transition">
                        &larr; Back
                    </button>
                    <button type="button" onclick="nextStep(3)" 
                            class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
                        Next Step &rarr;
                    </button>
                </div>
            </div>

            <div class="form-step hidden" data-step="3">
                <h2 class="text-xl font-semibold mb-4 text-blue-700">3. Finalize</h2>
                
                <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
                    <p class="text-sm text-blue-700">
                        Ready to generate your PDF? This will save your profile to the database.
                    </p>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Profile Name (For saving)</label>
                    <input type="text" name="profile_name" placeholder="e.g. Z83 data" required
                           class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>

                <div class="flex justify-between">
                    <button type="button" onclick="prevStep(2)" 
                            class="bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600 transition">
                        &larr; Back
                    </button>
                    <button type="submit" 
                            class="bg-green-600 text-white px-8 py-2 rounded hover:bg-green-700 transition font-bold shadow-lg">
                        Generate PDF
                    </button>
                </div>
            </div>

        </form>
    </div>

    <script>
       
    </script>
</body>
</html>
