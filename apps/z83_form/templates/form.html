<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-md mx-auto bg-white p-8 shadow-lg rounded">
        <h1 class="text-xl font-bold mb-4">Smart Z83 Editor</h1>
        <form method="POST">
            <label class="block mb-2">Surname</label>
            <input type="text" name="surname" class="w-full border p-2 mb-4" required>
            
            <label class="block mb-2">ID Number</label>
            <input type="text" name="id_number" class="w-full border p-2 mb-4" required>
            
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
                Generate Z83 PDF
            </button>
        </form>
    </div>
</body>
</html>
